[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "studio-ai"
version = "0.1.0"
description = "Python backend and Telegram service for Studio AI"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "fal-client>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
studio-ai-api = "studio_ai.api.app:run"
studio-ai-bot = "studio_ai.telegram.bot:run"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["studio_ai"]
